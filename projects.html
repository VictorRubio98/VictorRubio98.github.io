<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Víctor Rubio Jornet</title>
  <meta name="description" content="Research projects involving Víctor Rubio Jornet at UPC, including MOBILYTICS, COMPROMISE, DISCOVERY, and MobiCugat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">V. <span>Rubio-Jornet</span></a>
      <button class="hamburger" onclick="document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links">
        <li><a href="index.html">About</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="teaching.html">Teaching</a></li>
        <li><a href="cv.html">CV</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Research Projects</h1>
      <p>Funded research projects I have been involved in.</p>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div id="projects"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Víctor Rubio Jornet · Built with GitHub Pages</p>
  </footer>

  <script>
    function renderProject(proj) {
      const partnersHtml = proj.partners.map(p => '<span class="skill-tag">' + p + '</span>').join('');
      return '<section class="section fade-in">'
        + '<div class="card">'
        + '<div class="card-header">'
        + '<div>'
        + '<h3><a href="' + proj.url + '" target="_blank" rel="noopener">' + proj.name + '</a></h3>'
        + '<p class="institution">' + proj.institution + '</p>'
        + '</div>'
        + '<span class="date">' + proj.startDate + ' – ' + proj.endDate + '</span>'
        + '</div>'
        + '<p style="margin-bottom: 0.3rem;"><strong>Code:</strong> ' + proj.code + '</p>'
        + '<p>' + proj.description + '</p>'
        + '<br>'
        + '<p><strong>Partners:</strong></p>'
        + '<div class="skill-tags" style="margin-top: 0.4rem;">' + partnersHtml + '</div>'
        + '</div>'
        + '</section>';
    }

    fetch('data/projects.json')
      .then(r => r.json())
      .then(projects => {
        document.getElementById('projects').innerHTML = projects.map(renderProject).join('');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
          });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
      });
  </script>

</body>
</html>
