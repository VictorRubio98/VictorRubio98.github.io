<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teaching — Víctor Rubio Jornet</title>
  <meta name="description" content="Teaching and mentoring experience of Víctor Rubio Jornet at Universitat Politècnica de Catalunya (UPC).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">V. <span>Rubio-Jornet</span></a>
      <button class="hamburger" onclick="document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links">
        <li><a href="index.html">About</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="teaching.html" class="active">Teaching</a></li>
        <li><a href="cv.html">CV</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Teaching &amp; Mentoring</h1>
      <p>Courses, thesis supervision, and educational projects.</p>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Teaching -->
    <section class="section fade-in">
      <h2 class="section-title">Teaching</h2>
      <div id="teaching"></div>
    </section>

    <!-- Thesis Supervision -->
    <section class="section fade-in">
      <h2 class="section-title">Thesis Supervision</h2>
      <div id="theses"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Víctor Rubio Jornet · Built with GitHub Pages</p>
  </footer>

  <script>
    function renderTeaching(t) {
      return '<div class="card">'
        + '<div class="card-header">'
        + '<div>'
        + '<h3>' + t.course + ' — ' + t.role + '</h3>'
        + '<p class="institution">' + t.degree + ', ' + t.institution + '</p>'
        + '</div>'
        + '<span class="date">' + t.date + '</span>'
        + '</div>'
        + '<p>' + t.description + '</p>'
        + '</div>';
    }

    function renderThesis(t) {
      const statusLabel = t.status === 'ongoing' ? 'Ongoing' : 'Completed';
      return '<div class="card">'
        + '<div class="card-header">'
        + '<div>'
        + '<h3>' + t.degree + ' — ' + t.role + '</h3>'
        + '<p class="institution">' + t.institution + '</p>'
        + '</div>'
        + '<span class="date">' + statusLabel + '</span>'
        + '</div>'
        + '<p>' + t.description + '</p>'
        + '</div>';
    }

    Promise.all([
      fetch('data/teaching.json').then(r => r.json()),
      fetch('data/theses.json').then(r => r.json())
    ]).then(([teaching, theses]) => {
      document.getElementById('teaching').innerHTML = teaching.map(renderTeaching).join('');
      document.getElementById('theses').innerHTML = theses.map(renderThesis).join('');
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>

</body>
</html>
