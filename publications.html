<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications — Víctor Rubio Jornet</title>
  <meta name="description" content="Publications by Víctor Rubio Jornet on data privacy, differential privacy, and machine learning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">V. <span>Rubio-Jornet</span></a>
      <button class="hamburger" onclick="document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links">
        <li><a href="index.html">About</a></li>
        <li><a href="publications.html" class="active">Publications</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="teaching.html">Teaching</a></li>
        <li><a href="cv.html">CV</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Publications</h1>
      <p>Conference papers, journal articles, and works under review.</p>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Journal Articles -->
    <section class="section fade-in">
      <h2 class="section-title">Journal Articles</h2>
      <div id="journal-articles"></div>
    </section>

    <!-- Conference Papers -->
    <section class="section fade-in">
      <h2 class="section-title">Conference Papers</h2>
      <div id="conference-papers"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Víctor Rubio Jornet · Built with GitHub Pages</p>
  </footer>

  <script>
    const pdfIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="7.5" y="17" font-size="6" font-weight="700" stroke="none" fill="currentColor" font-family="sans-serif">PDF</text></svg>';
    const bibIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/><text x="8" y="14" font-size="6" font-weight="700" stroke="none" fill="currentColor" font-family="sans-serif">Bib</text></svg>';

    function buildVenue(pub) {
      let v = pub.venue;
      if (pub.year) v += ' ' + pub.year;
      if (pub.volume) v += ' Volume ' + pub.volume;
      if (pub.issue) v += ', Issue ' + pub.issue;
      if (pub.pages) v += ', pp. ' + pub.pages;
      return v;
    }

    function renderPub(pub) {
      const titleHtml = pub.webUrl
        ? '<a href="' + pub.webUrl + '" target="_blank" rel="noopener">' + pub.title + '</a>'
        : pub.title;

      const badgeClass = pub.status === 'published' ? 'published' : 'review';
      const badgeText = pub.status === 'published' ? 'Published' : 'Under Review';

      const hasLinks = pub.pdfUrl || pub.bibtexUrl;
      let linksHtml = '';
      if (pub.pdfUrl) linksHtml += '<a href="' + pub.pdfUrl + '" target="_blank" rel="noopener" title="PDF">' + pdfIcon + '</a>';
      if (pub.bibtexUrl) linksHtml += '<a href="' + pub.bibtexUrl + '" target="_blank" rel="noopener" title="BibTeX">' + bibIcon + '</a>';

      let footerHtml;
      if (hasLinks) {
        footerHtml = '<div class="pub-footer"><span class="pub-badge ' + badgeClass + '">' + badgeText + '</span><div class="pub-links">' + linksHtml + '</div></div>';
      } else {
        footerHtml = '<span class="pub-badge ' + badgeClass + '">' + badgeText + '</span>';
      }

      return '<div class="card pub-card">'
        + '<p class="pub-title">' + titleHtml + '</p>'
        + '<p class="pub-authors">' + pub.authors + '</p>'
        + '<p class="pub-venue">' + buildVenue(pub) + '</p>'
        + footerHtml
        + '</div>';
    }

    fetch('data/publications.json')
      .then(r => r.json())
      .then(pubs => {
        document.getElementById('journal-articles').innerHTML =
          pubs.filter(p => p.type === 'journal').map(renderPub).join('');
        document.getElementById('conference-papers').innerHTML =
          pubs.filter(p => p.type === 'conference').map(renderPub).join('');
      });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>

</body>
</html>
